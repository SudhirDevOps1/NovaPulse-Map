name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No npm install: the project has zero dependencies by design.
      # A cache step here would be dead weight.

      - name: Syntax check
        run: node --check src/novapulse.js && node --check dist/novapulse.js

      - name: Test
        run: npm test

      # --check does not write. It fails the job if dist/ or the HTML asset
      # URLs have drifted from src/ or from package.json's version.
      - name: Verify dist and asset versions are current
        run: npm run build:check

      - name: Serve examples
        run: node scripts/serve.mjs 5173 &

      - name: Wait for dev server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5173/examples/01-auto-init.html > /dev/null; then
              echo "server up"; exit 0
            fi
            sleep 1
          done
          echo "server did not start"; exit 1

      # A page loading an old bundle is indistinguishable from a library bug,
      # so assert the served file carries the current version.
      #
      # NOTE: the body is captured whole and parsed afterwards. Piping curl
      # into `head -1` makes curl die of SIGPIPE (141), which `pipefail`
      # turns into a failed pipeline — the check failed for a reason that had
      # nothing to do with the version.
      - name: Served bundle matches package version
        run: |
          set -euo pipefail
          want=$(node -p "require('./package.json').version")
          body=$(curl -sf "http://127.0.0.1:5173/dist/novapulse.min.js?v=$want")
          echo "want version: $want"
          echo "served bytes: ${#body}"
          case "$body" in
            *"$want"*) echo "version ok" ;;
            *)
              echo "VERSION MISMATCH"
              printf '%s\n' "${body:0:160}"
              exit 1
              ;;
          esac

      - name: Feed endpoint responds
        run: |
          curl -sf http://127.0.0.1:5173/api/probes.json | head -c 200
          echo ""

      # Lighthouse via the Chrome DevTools Protocol. Uploaded as an
      # artifact so a failing score is inspectable, not just a red X.
      - name: Lighthouse accessibility
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://127.0.0.1:5173/examples/01-auto-init.html
            http://127.0.0.1:5173/examples/02-js-api.html
            http://127.0.0.1:5173/examples/03-iframe-host.html
            http://127.0.0.1:5173/examples/04-live-feed.html
            http://127.0.0.1:5173/examples/05-advanced.html
            http://127.0.0.1:5173/examples/embed-widget.html
          uploadArtifacts: true
          temporaryPublicStorage: true
          config: |
            {
              "collect": {
                "numberOfRuns": 1,
                "settings": { "preset": "desktop" }
              },
              "assert": {
                "assertions": {
                  "categories:accessibility": ["error", { "minScore": 1 }],
                  "categories:best-practices": ["error", { "minScore": 1 }],
                  "categories:seo": ["error", { "minScore": 1 }]
                }
              }
            }