name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No npm install: the project has zero dependencies by design.
      # A cache step here would be dead weight.

      - name: Syntax check
        run: node --check src/novapulse.js && node --check dist/novapulse.js

      - name: Test
        run: npm test

      - name: Verify dist is up to date with src
        run: npm run build && npm run build:check

      - name: Serve examples
        run: node scripts/serve.mjs 5173 &

      - name: Wait for dev server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5173/examples/01-auto-init.html > /dev/null; then
              echo "server up"; exit 0
            fi
            sleep 1
          done
          echo "server did not start"; exit 1

      - name: Feed endpoint responds
        run: |
          curl -sf http://127.0.0.1:5173/api/probes.json | head -c 200
          echo ""

      # Lighthouse via the Chrome DevTools Protocol. Uploaded as an
      # artifact so a failing score is inspectable, not just a red X.
      - name: Lighthouse accessibility
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://127.0.0.1:5173/examples/01-auto-init.html
            http://127.0.0.1:5173/examples/02-js-api.html
            http://127.0.0.1:5173/examples/03-iframe-host.html
            http://127.0.0.1:5173/examples/04-live-feed.html
          uploadArtifacts: true
          temporaryPublicStorage: true
          config: |
            {
              "collect": {
                "numberOfRuns": 1,
                "settings": { "preset": "desktop" }
              },
              "assert": {
                "assertions": {
                  "categories:accessibility": ["error", { "minScore": 1 }],
                  "categories:best-practices": ["error", { "minScore": 1 }],
                  "categories:seo": ["warn", { "minScore": 1 }]
                }
              }
            }