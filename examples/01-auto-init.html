<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Auto-init example for NovaPulse Edge Map: a keyless, embeddable Leaflet world map of edge-probe vantage points with pulsing status markers and latency tooltips." />
<meta name="theme-color" content="#0B0F14" />
<title>NovaPulse Edge Map — Example 1 · Auto-init</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="../dist/novapulse.css?v=1.2.0" />
<style>
  body{margin:0;background:#0B0F14;color:#E2E8F0;
       font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:40px 24px}
  h1{font-size:1.6rem;letter-spacing:-.02em;margin:0 0 6px}
  p.lede{color:#94A3B8;margin:0 0 28px;font-size:.95rem;max-width:62ch}
  code{background:#111823;border:1px solid #243244;border-radius:4px;padding:1px 5px;font-size:.85em}
  .panel{margin-top:28px;background:#111823;border:1px solid #243244;border-radius:12px;padding:20px 22px}
  .panel h2{margin:0 0 12px;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:#9FB0C6}
  .btn{background:#1B2634;border:1px solid #33455C;color:#E2E8F0;border-radius:8px;
       padding:8px 14px;font:inherit;font-size:.85rem;cursor:pointer;margin:0 6px 6px 0}
  .btn:hover{background:#243244}
  .btn:focus-visible{outline:2px solid #38BDF8;outline-offset:2px}
  #log{font-family:ui-monospace,Menlo,monospace;font-size:.78rem;color:#9FB0C6;
       max-height:170px;overflow:auto;white-space:pre-wrap}
</style>
</head>
<body>
<div class="wrap">
  <main>
  <h1>Example 1 — Auto-init</h1>
  <p class="lede">
    Zero JavaScript on the page. A single <code>data-novapulse-map</code> attribute plus the
    script tag is the whole integration. Everything below the map is the public API being
    driven from the console panel.
  </p>

  <!-- The entire integration: -->
  <div data-novapulse-map
       data-height="440"
       data-zoom="2"
       data-show-toggle="true"
       data-show-stats="true"
       data-show-table="true"
       data-cluster="true"
       data-nodes='[
         {"id":"iad","name":"Ashburn","region":"us-east","lat":39.0438,"lon":-77.4874,"status":"Operational","latency":12},
         {"id":"ewr","name":"New York","region":"us-east","lat":40.7128,"lon":-74.0060,"status":"Operational","latency":18},
         {"id":"ord","name":"Chicago","region":"us-central","lat":41.8781,"lon":-87.6298,"status":"Operational","latency":24},
         {"id":"dfw","name":"Dallas","region":"us-central","lat":32.7767,"lon":-96.7970,"status":"Operational","latency":31},
         {"id":"sjc","name":"San Jose","region":"us-west","lat":37.3541,"lon":-121.9552,"status":"Operational","latency":42},
         {"id":"lhr","name":"London","region":"eu-west","lat":51.5074,"lon":-0.1278,"status":"Operational","latency":78},
         {"id":"fra","name":"Frankfurt","region":"eu-central","lat":50.1109,"lon":8.6821,"status":"Operational","latency":84},
         {"id":"ams","name":"Amsterdam","region":"eu-west","lat":52.3676,"lon":4.9041,"status":"Operational","latency":86},
         {"id":"dxb","name":"Dubai","region":"me","lat":25.2048,"lon":55.2708,"status":"Operational","latency":121},
         {"id":"bom","name":"Mumbai","region":"apac","lat":19.0760,"lon":72.8777,"status":"Degraded","latency":148},
         {"id":"gru","name":"São Paulo","region":"sa","lat":-23.5505,"lon":-46.6333,"status":"Down","latency":0},
         {"id":"sin","name":"Singapore","region":"apac","lat":1.3521,"lon":103.8198,"status":"Operational","latency":186},
         {"id":"nrt","name":"Tokyo","region":"apac","lat":35.6762,"lon":139.6503,"status":"Operational","latency":204},
         {"id":"syd","name":"Sydney","region":"apac","lat":-33.8688,"lon":151.2093,"status":"Operational","latency":238}
       ]'></div>

  <div class="panel">
    <h2>Public API</h2>
    <button class="btn" id="bPause">Toggle live</button>
    <button class="btn" id="bOutage">Simulate outage</button>
    <button class="btn" id="bClear">Clear all nodes</button>
    <button class="btn" id="bFit">Fit bounds</button>
    <button class="btn" id="bZoom">Zoom in</button>
    <button class="btn" id="bDestroy">Destroy</button>
    <div id="log" style="margin-top:14px"></div>
  </div>
  </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../dist/novapulse.js?v=1.2.0"></script>
<script>
/* Auto-init runs on DOMContentLoaded. This example's scripts sit at the
   end of <body>, so on a normal (non-defer) load we must let that event
   fire before reaching for the instance. */
function whenReady(fn){
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', fn, { once:true });
  } else {
    fn();
  }
}

var mapEl = document.querySelector('[data-novapulse-map]');
var logEl = document.getElementById('log');

whenReady(function(){
var inst = mapEl.__npsInstance;
if (!inst) { log('auto-init did not run'); return; }

function log(msg){
  var d = document.createElement('div');
  d.textContent = new Date().toLocaleTimeString() + '  ' + msg;
  logEl.prepend(d);
}
log('NovaPulseMap v' + NovaPulseMap.VERSION + ' auto-initialised');
log('nodes: ' + inst.getNodes().length + ', clusters: ' + inst.getState().clusters);

/* Subscribe to every event the library emits. */
['ready','nodeclick','livechange','error','destroy'].forEach(function(evt){
  inst.on(evt, function(d){ log(evt + (d && d.name ? ' → ' + d.name : '')); });
});

document.getElementById('bPause').onclick = function(){ inst.toggleLive(); };
document.getElementById('bFit').onclick   = function(){ inst.fit(); };
document.getElementById('bZoom').onclick  = function(){ inst.zoomIn(); };
document.getElementById('bDestroy').onclick = function(){
  inst.destroy();
  log('destroyed — DOM cleared, timers stopped, listeners removed');
};
document.getElementById('bClear').onclick = function(){ inst.setNodes([]); log('setNodes([])'); };
document.getElementById('bOutage').onclick = function(){
  inst.setNodes(inst.getNodes().map(function(n, i){
    return { id:n.id, name:n.name, region:n.region, lat:n.lat, lon:n.lon,
             status: i % 4 === 0 ? 'Down' : 'Operational', latency: n.latency };
  }));
  log('every 4th node forced Down');
};
}); /* whenReady */
</script>
</body>
</html>
