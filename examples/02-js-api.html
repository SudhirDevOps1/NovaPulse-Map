<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="JavaScript API example for NovaPulse Edge Map: two independent Leaflet maps on one page with independent state, themes and clustering settings." />
<meta name="theme-color" content="#0B0F14" />
<title>NovaPulse Edge Map — Example 2 · JS API</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="../dist/novapulse.css?v=1.2.0" />
<style>
  body{margin:0;background:#0B0F14;color:#E2E8F0;
       font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:40px 24px}
  h1{font-size:1.6rem;letter-spacing:-.02em;margin:0 0 6px}
  p.lede{color:#94A3B8;margin:0 0 28px;font-size:.95rem;max-width:64ch}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:860px){.grid{grid-template-columns:1fr}}
  .box{background:#111823;border:1px solid #243244;border-radius:12px;padding:18px 20px}
  .box h2{margin:0 0 12px;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:#9FB0C6}
  /* Generous padding keeps every button over the 24x24 touch-target floor. */
.btn{background:#1B2634;border:1px solid #33455C;color:#E2E8F0;border-radius:8px;
     min-height:32px;padding:8px 16px;font:inherit;font-size:.85rem;
     cursor:pointer;margin:0 8px 8px 0}
  .btn:hover{background:#243244}
  .btn:focus-visible{outline:2px solid #38BDF8;outline-offset:2px}
  #a{--nps-height:300px}
  #b{--nps-height:300px}
  pre{font-size:.76rem;color:#9FB0C6;overflow:auto;margin:0;white-space:pre-wrap}
</style>
</head>
<body>
<div class="wrap">
  <main>
  <h1>Example 2 — JavaScript API</h1>
  <p class="lede">
    Full programmatic control. Two independent instances on one page prove there are no
    global-state or ID collisions. Light theme on the right uses a different tile preset.
  </p>

  <div class="grid">
    <div>
      <div id="a"></div>
      <div style="margin-top:12px">
        <button class="btn" id="toggleA">Toggle live</button>
        <button class="btn" id="fitA">Fit</button>
        <button class="btn" id="killA">Destroy</button>
      </div>
    </div>
    <div>
      <div id="b"></div>
      <div style="margin-top:12px">
        <button class="btn" id="toggleB">Toggle live</button>
        <button class="btn" id="fitB">Fit</button>
        <button class="btn" id="themeB">Swap theme</button>
      </div>
    </div>
  </div>

  <div class="box" style="margin-top:22px">
    <h2>Live state</h2>
    <pre id="state"></pre>
  </div>
  </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../dist/novapulse.js?v=1.2.0"></script>
<script>
var NODES = [
  {id:'iad',name:'Ashburn',region:'us-east',lat:39.0438,lon:-77.4874,status:'Operational',latency:12},
  {id:'ewr',name:'New York',region:'us-east',lat:40.7128,lon:-74.0060,status:'Operational',latency:18},
  {id:'ord',name:'Chicago',region:'us-central',lat:41.8781,lon:-87.6298,status:'Operational',latency:24},
  {id:'sjc',name:'San Jose',region:'us-west',lat:37.3541,lon:-121.9552,status:'Operational',latency:42},
  {id:'lhr',name:'London',region:'eu-west',lat:51.5074,lon:-0.1278,status:'Operational',latency:78},
  {id:'fra',name:'Frankfurt',region:'eu-central',lat:50.1109,lon:8.6821,status:'Operational',latency:84},
  {id:'ams',name:'Amsterdam',region:'eu-west',lat:52.3676,lon:4.9041,status:'Operational',latency:86},
  {id:'dxb',name:'Dubai',region:'me',lat:25.2048,lon:55.2708,status:'Operational',latency:121},
  {id:'bom',name:'Mumbai',region:'apac',lat:19.0760,lon:72.8777,status:'Degraded',latency:148},
  {id:'gru',name:'São Paulo',region:'sa',lat:-23.5505,lon:-46.6333,status:'Down',latency:0},
  {id:'sin',name:'Singapore',region:'apac',lat:1.3521,lon:103.8198,status:'Operational',latency:186},
  {id:'nrt',name:'Tokyo',region:'apac',lat:35.6762,lon:139.6503,status:'Operational',latency:204},
  {id:'syd',name:'Sydney',region:'apac',lat:-33.8688,lon:151.2093,status:'Operational',latency:238}
];

var a = new NovaPulseMap({
  container: '#a',
  nodes: NODES,
  height: 300,
  theme: 'dark',
  showToggle: true,
  showStats: false,
  showTable: false,
  refreshMs: 3000,
  onNodeClick: function(node){ console.log('clicked', node.id, node.name, node.status); }
});

var b = new NovaPulseMap({
  container: '#b',
  nodes: NODES.slice(0, 8),
  height: 300,
  theme: 'light',
  tile: 'osmLight',
  showStats: true,
  showTable: false,
  /* Instance B has Ashburn + New York + London + Frankfurt + Amsterdam,
     which at world zoom land within a few pixels of each other. Leaving
     clustering ON is what keeps those tappable; see the note below. */
  cluster: true
});

document.getElementById('toggleA').onclick = function(){ a.toggleLive(); };
document.getElementById('fitA').onclick    = function(){ a.fit(); };
document.getElementById('killA').onclick   = function(){ a.destroy(); };
document.getElementById('toggleB').onclick = function(){ b.toggleLive(); };
document.getElementById('fitB').onclick    = function(){ b.fit(); };

/* Rebuilding with a different theme means a fresh instance — the tile
   source is chosen at construction, so this is the supported path. */
var lightOn = true;
document.getElementById('themeB').onclick = function(){
  b.destroy();
  lightOn = !lightOn;
  b = new NovaPulseMap({
    container: '#b', nodes: NODES.slice(0, 8), height: 300,
    theme: lightOn ? 'light' : 'dark',
    tile: lightOn ? 'osmLight' : 'osmDark',
    showStats: true, showTable: false, cluster: true
  });
};

function paint(){
  var sa = a.getState(), sb = b.getState();
  document.getElementById('state').textContent =
    'instance A (dark)\n' +
    '  nodes     : ' + sa.nodes.length + '\n' +
    '  clusters  : ' + sa.clusters + '\n' +
    '  live      : ' + sa.live + '\n' +
    '  zoom      : ' + sa.zoom + '\n' +
    '  status    : ' + sa.status + '\n' +
    '  counts    : ' + JSON.stringify(sa.counts) + '\n\n' +
    'instance B (light)\n' +
    '  nodes     : ' + sb.nodes.length + '\n' +
    '  clusters  : ' + sb.clusters + '  (clustering disabled)\n' +
    '  live      : ' + sb.live + '\n' +
    '  status    : ' + sb.status;
}
paint();
setInterval(paint, 2000);
</script>
</body>
</html>
